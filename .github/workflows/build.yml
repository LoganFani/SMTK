name: Build and Release SMTK

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # CRITICAL: Fixes the 403 error

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            binary_path: dist/SMTK.app
          - os: windows-latest
            platform: windows
            binary_path: dist/SMTK
          - os: ubuntu-latest
            platform: linux
            binary_path: dist/SMTK

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Detect separator for --add-data based on OS
          if [ "${{ matrix.os }}" = "windows-latest" ]; then SEP=";"; else SEP=":"; fi
          
          pyinstaller --name SMTK \
            --noconfirm --clean --onedir --windowed \
            --collect-all fastapi --collect-all uvicorn --collect-all transformers \
            --add-data "media${SEP}media" \
            --add-data "static${SEP}static" \
            --add-data "templates${SEP}templates" \
            build.py

      - name: Compress (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/SMTK -DestinationPath "SMTK-windows.zip"

      - name: Compress (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: zip -r "SMTK-${{ matrix.platform }}.zip" ${{ matrix.binary_path }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMTK-${{ matrix.platform }}
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
