name: Build and Release SMTK

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build app
        run: |
          pyinstaller \
            --name SMTK \
            --icon "media/simmy-icon-mac.icns" \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --collect-all fastapi \
            --collect-all genanki \
            --collect-all uvicorn \
            --collect-all transformers \
            --collect-all pillow \
            --collect-all pystray \
            --collect-all requests \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            --add-data "media:media" \
            --add-data "static:static" \
            --add-data "templates:templates" \
            build.py

      - name: Zip artifact
        run: zip -r "SMTK-macos-${GITHUB_REF_NAME}.zip" dist/SMTK.app

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "SMTK-macos-${{ github.ref_name }}.zip"
          asset_path: "SMTK-macos-${GITHUB_REF_NAME}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build exe
        run: pyinstaller --name SMTK --icon "media/simmy-icon-windows.ico" --noconfirm --clean --onedir --windowed --collect-all fastapi --collect-all genanki --collect-all uvicorn --collect-all transformers --collect-all pillow --collect-all pystray --collect-all requests --collect-all sentencepiece --collect-all onnxruntime --add-data "media;media" --add-data "static;static" --add-data "templates;templates" build.py
       

      - name: Zip artifact
        shell: cmd
        run: powershell Compress-Archive -Path dist\SMTK -DestinationPath "SMTK-windows-${GITHUB_REF_NAME}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "SMTK-windows-${{ github.ref_name }}.zip"
          asset_path: "SMTK-windows-${GITHUB_REF_NAME}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build app
        run: |
          pyinstaller \
            --name SMTK \
            --icon "media/simmy-icon-linux.png" \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --collect-all fastapi \
            --collect-all genanki \
            --collect-all uvicorn \
            --collect-all transformers \
            --collect-all pillow \
            --collect-all pystray \
            --collect-all requests \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            --add-data "media:media" \
            --add-data "static:static" \
            --add-data "templates:templates" \
            build.py

      - name: Zip artifact
        run: zip -r "SMTK-linux-${GITHUB_REF_NAME}.zip" dist/SMTK

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "SMTK-linux-${{ github.ref_name }}.zip"
          asset_path: "SMTK-linux-${GITHUB_REF_NAME}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
