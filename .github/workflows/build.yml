name: Build SMTK

on:
  push:
    tags:
      - 'v*'   # Build only on version tags like v1.0.0
  workflow_dispatch:  # Manual trigger

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build app
        run: |
          pyinstaller \
            --name SMTK \
            --icon="media/simmy-icon-mac.icns" \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --collect-all fastapi \
            --collect-all genanki \
            --collect-all uvicorn \
            --collect-all transformers \
            --collect-all pillow \
            --collect-all pystray \
            --collect-all requests \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            --add-data "media:media" \
            --add-data "static:static" \
            --add-data "templates:templates" \
            build.py

      - name: Zip artifact
        run: zip -r "SMTK-mac-${GITHUB_REF_NAME}.zip" dist/SMTK.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMTK-mac-${GITHUB_REF_NAME}
          path: "SMTK-mac-${GITHUB_REF_NAME}.zip"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build exe
        run: |
          pyinstaller ^
            --name SMTK ^
            --icon "media/simmy-icon-windows.ico" ^
            --noconfirm ^
            --clean ^
            --onedir ^
            --windowed ^
            --collect-all fastapi ^
            --collect-all genanki ^
            --collect-all uvicorn ^
            --collect-all transformers ^
            --collect-all pillow ^
            --collect-all pystray ^
            --collect-all requests ^
            --collect-all sentencepiece ^
            --collect-all onnxruntime ^
            --add-data "media;media" ^
            --add-data "static;static" ^
            --add-data "templates;templates" ^
            build.py

      - name: Zip artifact
        run: powershell Compress-Archive -Path dist\SMTK -DestinationPath "SMTK-win-${GITHUB_REF_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMTK-win-${GITHUB_REF_NAME}
          path: "SMTK-win-${GITHUB_REF_NAME}.zip"

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build app
        run: |
          pyinstaller \
            --name SMTK \
            --icon="media/simmy-icon-linux.png" \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --collect-all fastapi \
            --collect-all genanki \
            --collect-all uvicorn \
            --collect-all transformers \
            --collect-all pillow \
            --collect-all pystray \
            --collect-all requests \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            --add-data "media:media" \
            --add-data "static:static" \
            --add-data "templates:templates" \
            build.py

      - name: Zip artifact
        run: zip -r "SMTK-linux-${GITHUB_REF_NAME}.zip" dist/SMTK

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMTK-linux-${GITHUB_REF_NAME}
          path: "SMTK-linux-${GITHUB_REF_NAME}.zip"
