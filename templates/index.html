<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTK</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <nav class="tabs">
        <a href="/" class="tab-link active">Home</a>
        <a href="/decks" class="tab-link">Decks</a>
        <a href="/models" class="tab-link">Language Models</a>
    </nav>

    <h1>SMTK</h1>
    
    <div class="toolbar">
        <div class="file-input-wrapper">
            <button class="btn btn-file">Upload File (.srt, .txt)</button>
            <input type="file" id="fileUpload" accept=".srt,.txt">
        </div>

        <div class="lang-group">
            <label for="modelSelect">Translation Model:</label>
            <select id="modelSelect" style="padding: 8px; border-radius: 6px; width: 100%;">
            <option value="">Select</option>
            </select>
        </div>
    </div>

    <textarea id="transcriptInput" placeholder="Paste your transcript here or upload a file..."></textarea>

    <div class="generate-container">
        <button id="generate-btn" class="btn" onclick="sendData()">Generate Cards</button>
    </div>
</div>

    <script src="/static/script.js"></script>
</body>
</html>
