<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTK | Decks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="container">
        <nav class="tabs">
            <a href="/" class="tab-link">HOME</a>
            <a href="/decks" class="tab-link active">DECKS</a>
            <a href="/models" class="tab-link">MODELS</a>
            <a href="/settings" class="tab-link">SETTINGS</a>

            <button id="themeToggle" class="btn" style="margin-left: auto; padding: 5px 12px; font-size: 0.7rem;">
                THEME: DARK
            </button>
        </nav>

        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; margin: 0; letter-spacing: -1px;">MANAGE DECKS</h1>
            <p style="color: var(--text-dim); font-family: 'JetBrains Mono'; font-size: 0.85rem;">[ EDIT, EXPORT OR DELETE YOUR DECKS ]</p>
        </header>

        <div style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 30px; display: flex; gap: 15px; align-items: center;">
            <span style="color: var(--primary-green); font-family: 'JetBrains Mono'; font-size: 0.8rem;">NEW DECK:</span>
            <input type="text" id="newDeckName" placeholder="Enter deck name..." style="flex-grow: 1;">
            <button class="btn" onclick="addDeck()">CREATE</button>
        </div>

        <table class="card-table">
            <thead>
                <tr>
                    <th style="text-align: left;">DECK NAME</th>
                    <th style="text-align: right;">ACTIONS</th>
                </tr>
            </thead>
            <tbody id="deckTableBody">
                </tbody>
        </table>
    </div>
    <script src="/static/decks.js"></script>
</body>
</html>
